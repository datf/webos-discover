name: Release Binaries

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  releases-matrix:
    name: Release Go Binaries
    permissions:
      contents: write
    runs-on: ubuntu-latest

    strategy:
      matrix:
        goos: [linux, windows, darwin, freebsd]
        goarch: [amd64, arm64, "386"]
        exclude:
          - goarch: "386"
            goos: darwin
          - goarch: arm64
            goos: windows

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '^1.27'
          go-version-file: 'go.mod'

      - name: Build binary
        run: |
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -ldflags='-extldflags "-static"' -o webos-discover-${{ matrix.goos }}-${{ matrix.goarch }} -v .

      - name: Upload Build
        uses: softprops/action-gh-release@v3
        with:
          files: webos-discover-${{ matrix.goos }}-${{ matrix.goarch }}
